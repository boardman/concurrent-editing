server.port=8080

# WebSocket settings
spring.websocket.max-binary-message-size=1048576
spring.websocket.max-text-message-size=1048576

# PostgreSQL Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/collab_editor
spring.datasource.username=albumdb
spring.datasource.password=albumdb
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Logging
logging.level.com.example.collabeditor=INFO
logging.level.org.springframework.web.socket=INFO
